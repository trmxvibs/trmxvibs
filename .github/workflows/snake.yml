# 🐍 GitHub Contribution Snake Generator
# Author: Lokesh Kumar (@trmxvibs)
# YouTube: @termux2
# This workflow auto-generates a contribution graph snake animation daily.

name: 🐍 Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:     

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: trmxvibs
          outputs: dist/github-contribution-grid-snake.svg

      - name: Push generated snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
