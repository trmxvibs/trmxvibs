<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff9c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#39ff9c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="radarClip"><circle cx="400" cy="210" r="185"/></clipPath>
  </defs>

  <rect width="800" height="420" rx="12" fill="#04070a"/>
  <rect width="800" height="34" rx="12" fill="#0d1117"/>
  <rect y="16" width="800" height="18" fill="#0d1117"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="400" y="22" fill="#7d8590" font-size="12" text-anchor="middle">live_scan.sh — demo visualization (no real network data)</text>

  <g clip-path="url(#radarClip)">
    <circle cx="400" cy="210" r="185" fill="url(#glow)"/>
    <g stroke="#1c3d33" fill="none" stroke-width="1">
      <circle cx="400" cy="210" r="45"/>
      <circle cx="400" cy="210" r="90"/>
      <circle cx="400" cy="210" r="135"/>
      <circle cx="400" cy="210" r="180"/>
    </g>
    <line x1="220" y1="210" x2="580" y2="210" stroke="#1c3d33"/>
    <line x1="400" y1="30" x2="400" y2="390" stroke="#1c3d33"/>

    <!-- rotating sweep -->
    <g>
      <path d="M400,210 L400,30 A180,180 0 0,1 502,60 Z" fill="#39ff9c" opacity="0.18"/>
      <line x1="400" y1="210" x2="400" y2="30" stroke="#39ff9c" stroke-width="2" opacity="0.7"/>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 400 210" to="360 400 210" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- nodes with ping rings -->
    <g>
      <circle cx="290" cy="150" r="4" fill="#ff5f56"/>
      <circle cx="290" cy="150" r="4" stroke="#ff5f56" fill="none">
        <animate attributeName="r" from="4" to="34" dur="2s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.9" to="0" dur="2s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <line x1="400" y1="210" x2="290" y2="150" stroke="#39ff9c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/>
      </line>
    </g>

    <g>
      <circle cx="540" cy="270" r="4" fill="#ffbd2e"/>
      <circle cx="540" cy="270" r="4" stroke="#ffbd2e" fill="none">
        <animate attributeName="r" from="4" to="34" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.9" to="0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <line x1="400" y1="210" x2="540" y2="270" stroke="#39ff9c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/>
      </line>
    </g>

    <g>
      <circle cx="470" cy="120" r="4" fill="#39ff9c"/>
      <circle cx="470" cy="120" r="4" stroke="#39ff9c" fill="none">
        <animate attributeName="r" from="4" to="34" dur="2s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.9" to="0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <line x1="400" y1="210" x2="470" y2="120" stroke="#39ff9c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/>
      </line>
    </g>

    <g>
      <circle cx="320" cy="300" r="4" fill="#58a6ff"/>
      <circle cx="320" cy="300" r="4" stroke="#58a6ff" fill="none">
        <animate attributeName="r" from="4" to="34" dur="2s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.9" to="0" dur="2s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <line x1="400" y1="210" x2="320" y2="300" stroke="#39ff9c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/>
      </line>
    </g>

    <circle cx="400" cy="210" r="6" fill="#39ff9c"/>
  </g>

  <text x="24" y="410" fill="#39ff9c" font-size="13">NODES: 4 ACTIVE</text>
  <text x="776" y="410" fill="#7d8590" font-size="13" text-anchor="end">STATUS: MONITORING</text>
</svg>
